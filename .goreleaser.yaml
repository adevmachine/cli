version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: devmachine
    main: ./cmd/devmachine
    binary: devmachine
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

brews:
  - name: devmachine
    repository:
      owner: mydevmachine
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://mydevmachine.github.io/docs/
    description: Turn a VPS into workspaces you develop in
    license: MIT
    # advm is the short name for daily use. The full name is what appears in
    # documentation, errors and skills, so it stays the binary.
    extra_install: |
      bin.install_symlink bin/"devmachine" => "advm"
    caveats: |
      Teach your coding agent devmachine (Claude Code, Codex, and others):
        devmachine skills add
      Get started: https://mydevmachine.github.io/docs/getting-started/
    test: |
      system "#{bin}/devmachine", "version"
