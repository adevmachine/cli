---
# Generated by devmachine. Every run rewrites it; do not edit.
- hosts: devmachine
  become: true
  tasks:
    - name: base
      include_role:
        name: base
        apply:
          tags: [base]
      tags: [base]

    - name: firewall
      include_role:
        name: firewall
        apply:
          tags: [firewall]
      tags: [firewall]

    - name: caddy
      include_role:
        name: caddy
        apply:
          tags: [caddy]
      tags: [caddy]

    - name: docker
      include_role:
        name: docker
        apply:
          tags: [docker]
      tags: [docker]

    - name: claude-code for alice
      include_role:
        name: claude-code
        apply:
          tags: [claude-code]
      vars:
        devmachine_claude_code_plugins:
          - one
          - two
      loop:
        - {name: "alice", user: "alice"}
      loop_control:
        loop_var: devmachine_workspace
      tags: [claude-code]

    - name: dev for each workspace that declares it
      include_role:
        name: dev
        apply:
          tags: [dev]
      loop:
        - {name: "alice", user: "alice"}
        - {name: "bob", user: "bob"}
      loop_control:
        loop_var: devmachine_workspace
      tags: [dev]

    - name: sharing for each workspace that declares it
      include_role:
        name: sharing
        apply:
          tags: [sharing]
      loop:
        - {name: "alice", user: "alice"}
      loop_control:
        loop_var: devmachine_workspace
      tags: [sharing]

    - name: look for the shared gh login
      stat:
        path: "/etc/devmachine/gh/hosts.yml"
      register: devmachine_shared_gh
      check_mode: false
      tags: [dev, credentials]

    - name: the directories the shared gh login lands in
      file:
        path: "{{ devmachine_shared.path }}"
        state: directory
        owner: "{{ devmachine_shared.user }}"
        group: "{{ devmachine_shared.user }}"
        mode: "0700"
      loop:
        - {user: "alice", path: "~alice/.config"}
        - {user: "alice", path: "~alice/.config/gh"}
      loop_control:
        loop_var: devmachine_shared
      when: devmachine_shared_gh.stat.exists
      tags: [dev, credentials]

    - name: the shared gh login, for the workspaces that want it
      copy:
        src: "/etc/devmachine/gh/hosts.yml"
        dest: "{{ devmachine_shared.path }}"
        remote_src: true
        owner: "{{ devmachine_shared.user }}"
        group: "{{ devmachine_shared.user }}"
        mode: "0600"
      loop:
        - {user: "alice", path: "~alice/.config/gh/hosts.yml"}
      loop_control:
        loop_var: devmachine_shared
      when: devmachine_shared_gh.stat.exists
      tags: [dev, credentials]

    - name: claude-code again, now that the shared logins are in place
      include_role:
        name: claude-code
        apply:
          tags: [claude-code]
      vars:
        devmachine_claude_code_plugins:
          - one
          - two
      loop:
        - {name: "alice", user: "alice"}
      loop_control:
        loop_var: devmachine_workspace
      tags: [claude-code]

    - name: dev again, now that the shared logins are in place
      include_role:
        name: dev
        apply:
          tags: [dev]
      loop:
        - {name: "alice", user: "alice"}
        - {name: "bob", user: "bob"}
      loop_control:
        loop_var: devmachine_workspace
      tags: [dev]

    - name: sharing again, now that the shared logins are in place
      include_role:
        name: sharing
        apply:
          tags: [sharing]
      loop:
        - {name: "alice", user: "alice"}
      loop_control:
        loop_var: devmachine_workspace
      tags: [sharing]

    - name: sharing extends caddy.sites.d for alice
      copy:
        src: "/opt/devmachine/roles/sharing/files/sharing.caddy"
        dest: "/etc/caddy/sites.d/alice-sharing-sharing.caddy"
        owner: root
        group: root
        mode: "0644"
      tags: [sharing]

