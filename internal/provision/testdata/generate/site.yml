---
# Generated by devmachine. Every run rewrites it; do not edit.
- hosts: devmachine
  become: true
  tasks:
    - name: base
      include_role:
        name: base
        apply:
          tags: [base]
      tags: [base]

    - name: firewall
      include_role:
        name: firewall
        apply:
          tags: [firewall]
      tags: [firewall]

    - name: caddy
      include_role:
        name: caddy
        apply:
          tags: [caddy]
      tags: [caddy]

    - name: docker
      include_role:
        name: docker
        apply:
          tags: [docker]
      tags: [docker]

    - name: claude-code for alice
      include_role:
        name: claude-code
        apply:
          tags: [claude-code]
        devmachine_claude_code_plugins:
          - one
          - two
      loop:
        - {name: "alice", user: "alice"}
      loop_control:
        loop_var: devmachine_workspace
      tags: [claude-code]

    - name: sharing for each workspace that declares it
      include_role:
        name: sharing
        apply:
          tags: [sharing]
      loop:
        - {name: "alice", user: "alice"}
      loop_control:
        loop_var: devmachine_workspace
      tags: [sharing]

    - name: sharing extends caddy.sites.d for alice
      copy:
        src: "/opt/devmachine/roles/sharing/files/sharing.caddy"
        dest: "/etc/caddy/sites.d/alice-sharing-sharing.caddy"
        owner: root
        group: root
        mode: "0644"
      tags: [sharing]

