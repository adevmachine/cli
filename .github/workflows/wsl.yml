name: wsl

# Runs the CLI inside WSL (Ubuntu 24.04 on Windows) against the same WSL
# distribution acting as the server, so "does it work on Windows through WSL"
# has an answer backed by a real run.

on:
  push:
    branches: [da-wsl-ci]
  workflow_dispatch:

jobs:
  wsl:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: wsl-bash {0}
    steps:
      - name: Keep line endings as committed
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      - uses: Vampire/setup-wsl@v7
        with:
          distribution: Ubuntu-24.04
          wsl-shell-user: alice
          wsl-conf: |
            [boot]
            systemd=true
          additional-packages: >-
            openssh-server openssh-client sudo curl git ca-certificates
            python3 python3-venv tar

      - name: Report the WSL environment
        shell: pwsh
        run: wsl --version; wsl --list --verbose

      - name: Make the distribution look like a freshly bought server
        shell: wsl-bash -u root {0}
        run: |
          uname -a
          cat /etc/os-release
          if [ "$(ps -p 1 -o comm=)" = systemd ]; then
            echo yes > /etc/ci-systemd
          else
            echo no > /etc/ci-systemd
          fi
          echo "systemd as PID 1: $(cat /etc/ci-systemd)"

          mkdir -p /etc/ssh/sshd_config.d /run/sshd
          cat > /etc/ssh/sshd_config.d/10-ci.conf <<'EOF'
          Port 2222
          PermitRootLogin yes
          PasswordAuthentication yes
          KbdInteractiveAuthentication no
          EOF
          echo 'root:devmachine' | chpasswd
          ssh-keygen -A

          if [ "$(cat /etc/ci-systemd)" = yes ]; then
            systemctl disable --now ssh.socket || true
            systemctl enable ssh.service
            systemctl restart ssh.service
            systemctl --no-pager status ssh.service
          else
            /usr/sbin/sshd -p 2222
          fi
          for i in $(seq 1 20); do
            (exec 3<>/dev/tcp/127.0.0.1/2222) 2>/dev/null && break
            sleep 1
          done
          (exec 3<>/dev/tcp/127.0.0.1/2222) && echo "sshd listens on 2222"

      - name: Install Go and build this commit
        run: |
          series=$(sed -n 's/^go \([0-9]*\.[0-9]*\).*/\1/p' go.mod)
          version=$(curl -fsSL 'https://go.dev/dl/?mode=json&include=all' | python3 -c "
          import json, sys
          series = sys.argv[1]
          for r in json.load(sys.stdin):
              if r['stable'] and (r['version'] == 'go' + series or r['version'].startswith('go' + series + '.')):
                  print(r['version']); break
          " "$series")
          echo "Go $version for go.mod series $series"
          mkdir -p "$HOME/sdk"
          curl -fsSL "https://go.dev/dl/$version.linux-amd64.tar.gz" | tar -xz -C "$HOME/sdk"
          export PATH="$HOME/sdk/go/bin:$PATH"
          go version

          rm -rf "$HOME/src"
          mkdir -p "$HOME/src"
          cp -a . "$HOME/src/"
          cd "$HOME/src"
          go build -ldflags "-X main.version=dev-$(git rev-parse --short HEAD)" \
            -o "$HOME/bin/devmachine" ./cmd/devmachine
          "$HOME/bin/devmachine" version

      - name: Unit tests inside WSL
        run: |
          export DEVMACHINE_KEYCHAIN=off
          export PATH="$HOME/sdk/go/bin:$PATH"
          git config --global user.email "ci@example.com"
          git config --global user.name "ci"
          cd "$HOME/src"
          ls -la "$HOME/.ssh" 2>&1 || true
          go test ./...
          echo "~/.ssh after the tests:"
          ls -la "$HOME/.ssh" 2>&1 || true
          cat "$HOME/.ssh/config" 2>&1 || true

      - name: Install the latest release the way users do
        run: |
          curl -fsSL https://mydevmachine.sh/install.sh | sh
          "$HOME/.local/bin/devmachine" version
          "$HOME/.local/bin/devmachine" help >/dev/null

      - name: Set up a machine, a workspace, and use it
        run: |
          LOGS="$PWD/wsl-logs"
          mkdir -p "$LOGS"
          DM="$HOME/bin/devmachine"
          export DEVMACHINE_KEYCHAIN=off
          export DEVMACHINE_CONFIG
          DEVMACHINE_CONFIG=$(mktemp -d)
          HARDEN=
          if [ "$(cat /etc/ci-systemd)" = no ]; then
            HARDEN=--no-harden
          fi

          {
            echo "release CLI: $("$HOME/.local/bin/devmachine" version 2>&1)"
            echo "built CLI:   $("$DM" version 2>&1)"
            echo "systemd:     $(cat /etc/ci-systemd)"
            echo "kernel:      $(uname -r)"
          } | tee "$LOGS/versions.txt"

          failures=0
          results=()
          record() {
            results+=("$1  $2")
            [ "$1" = PASS ] || failures=$((failures + 1))
          }
          step() {
            name=$1 log=$2
            shift 2
            if "$@" >"$LOGS/$log.log" 2>&1; then
              record PASS "$name"
            else
              record FAIL "$name (see $log.log)"
            fi
            sed 's/^/    /' "$LOGS/$log.log"
          }
          expect() {
            name=$1 log=$2 want=$3
            shift 3
            got=$("$@" 2>"$LOGS/$log.err" | tr -d '\r' | tail -n 1) || true
            printf '%s\n' "$got" >"$LOGS/$log.log"
            if [ "$got" = "$want" ]; then
              record PASS "$name"
            else
              record FAIL "$name (wanted '$want', got '$got'; see $log.err)"
            fi
          }

          run_setup() {
            printf '%s\n' main 127.0.0.1 root 2222 "" y 1 devmachine \
              | "$DM" setup --no-essentials --no-aliases $HARDEN
          }
          ssh_whoami() {
            printf 'whoami\n' | "$DM" ssh acme
          }
          step "setup takes the machine over" setup run_setup
          cp "$DEVMACHINE_CONFIG/config.yml" "$LOGS/config.yml" 2>/dev/null || true
          step "doctor" doctor "$DM" doctor
          step "workspaces new acme" workspaces-new "$DM" workspaces new acme --yes
          step "sync --yes" sync "$DM" sync --yes
          expect "run --workspace acme -- whoami" run-whoami acme \
            "$DM" run --workspace acme -- whoami
          expect "ssh acme (commands on stdin)" ssh-whoami acme \
            ssh_whoami
          step "stats" stats "$DM" stats

          cat > "$HOME/in_terminal.py" <<'PY'
          import os, pty, sys
          answer, script = sys.argv[1], sys.argv[2]
          pid, fd = pty.fork()
          if pid == 0:
              os.execv(sys.argv[3], sys.argv[3:])
          seen, sent = b"", False
          while True:
              try:
                  chunk = os.read(fd, 4096)
              except OSError:
                  break
              if not chunk:
                  break
              seen += chunk
              if answer and not sent and b"[y/N]" in seen:
                  os.write(fd, answer.encode() + b"\n")
                  sent = True
              if script and not sent:
                  os.write(fd, script.encode() + b"\n")
                  sent = True
          sys.stdout.write(seen.decode(errors="replace").replace("\r\n", "\n"))
          _, status = os.waitpid(pid, 0)
          sys.exit(os.waitstatus_to_exitcode(status))
          PY
          in_terminal() {
            timeout "$1" python3 "$HOME/in_terminal.py" "${@:2}"
          }

          printf 'hello from wsl\n' > "$LOGS/report.txt"
          upload_file() {
            out=$("$DM" upload "$LOGS/report.txt" --workspace acme 2>&1) || { printf '%s\n' "$out"; return 1; }
            printf '%s\n' "$out"
            remote=$(printf '%s\n' "$out" | tail -n 1)
            case "$remote" in /home/acme/*) ;; *) return 1 ;; esac
            body=$("$DM" run --workspace acme -- "cat '$remote'" | tr -d '\r')
            echo "remote body: $body"
            [ "$body" = "hello from wsl" ]
          }
          step "upload a file into acme" upload upload_file

          ssh_terminal() {
            out=$(in_terminal 60 "" 'echo "who=$(whoami)"; exit' "$DM" ssh acme) || true
            printf '%s\n' "$out"
            printf '%s\n' "$out" | grep -q 'who=acme'
          }
          step "ssh acme in a real terminal" ssh-terminal ssh_terminal

          update_declined() {
            "$DM" workspaces new bob --yes || return 1
            out=$(in_terminal 300 n "" "$DM" update --skip-cli 2>&1)
            code=$?
            printf '%s\n' "$out"
            echo "exit: $code"
            printf '%s\n' "$out" | grep -q 'pass  connection' || return 1
            printf '%s\n' "$out" | grep -q 'change(s) would be made' || return 1
            printf '%s\n' "$out" | grep -qF 'Apply these changes with sync? [y/N]' || return 1
            if printf '%s\n' "$out" | grep -q '^==> sync '; then return 1; fi
            if [ "$code" -ne 0 ]; then
              printf '%s\n' "$out" | grep -qF 'error: update: doctor failed' || return 1
              if printf '%s\n' "$out" | grep -E '^ +fail ' | grep -v 'credential: '; then return 1; fi
            fi
            if "$DM" run --machine main -- 'id bob' >/dev/null 2>&1; then
              echo "bob exists: the n was not respected"
              return 1
            fi
            echo "bob was not created: the n was respected"
          }
          step "update --skip-cli, answer n" update-no update_declined
          step "sync --yes applies what update left pending" sync-after "$DM" sync --yes
          expect "run --workspace bob -- whoami" run-bob bob \
            "$DM" run --workspace bob -- whoami
          doctor_after_sync() {
            out=$("$DM" doctor 2>&1) || true
            printf '%s\n' "$out"
            ! printf '%s\n' "$out" | grep '^fail' | grep -v 'credential: '
          }
          step "doctor after sync (credential logins aside)" doctor-after doctor_after_sync
          echo "~/.ssh at the end:"
          ls -la "$HOME/.ssh" 2>&1 || true
          cat "$HOME/.ssh/config" 2>&1 || true

          echo
          printf '%s\n' "${results[@]}" | tee "$LOGS/summary.txt"
          [ "$failures" -eq 0 ]

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wsl-logs
          path: wsl-logs
          if-no-files-found: warn
